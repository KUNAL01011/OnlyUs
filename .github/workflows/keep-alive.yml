# External keep-alive: the most reliable way to stop Render's free service from
# sleeping. This GitHub Action pings the backend's /health endpoint every 10
# minutes. (The backend ALSO self-pings via node-cron, but an external pinger is
# what actually wakes a sleeping instance.)
#
# Setup: add a repository secret named BACKEND_URL = https://your-backend.onrender.com
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_URL secret not set; skipping."
            exit 0
          fi
          echo "Pinging $URL/health"
          curl -fsS --max-time 30 "$URL/health" || echo "Ping failed (service may be waking up)."
